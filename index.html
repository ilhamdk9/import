<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/2920/2920323.png">
    <title>HeyCase</title>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">

    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.15);
            --text-main: #f8fafc;
            --text-muted: #cbd5e1;
            --accent-gemini: #818cf8;
            --accent-cancer: #fb7185;
            --success: #34d399;
            --danger: #f87171;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #31103f 50%, #4c1d95 100%);
            color: var(--text-main);
            min-height: 100vh;
            width: 100%;
            overflow-x: hidden;
            position: relative;
        }

        /* Latar belakang Blobs */
        .blobs {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
            pointer-events: none;
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.45;
            animation: move 18s infinite alternate;
        }

        .b1 {
            top: -10%;
            left: -10%;
            width: 300px;
            height: 300px;
            background: #6366f1;
        }

        .b2 {
            bottom: -10%;
            right: -10%;
            width: 300px;
            height: 300px;
            background: #f43f5e;
            animation-delay: -4s;
        }

        @keyframes move {
            from {
                transform: translate(0, 0) scale(1);
            }
            to {
                transform: translate(25px, -25px) scale(1.1);
            }
        }

        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .glass-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.02));
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            width: 100%;
        }

        #app {
            display: flex;
            min-height: 100vh;
            width: 100%;
        }

        /* Sidebar Desktop */
        .sidebar {
            width: 260px;
            min-width: 260px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--glass-border);
            background: rgba(15, 23, 42, 0.95);
            position: sticky;
            top: 0;
            height: 100vh;
            z-index: 100;
        }

        .logo {
            font-size: 1.3rem;
            font-weight: 800;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(to right, #818cf8, #fb7185);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            white-space: nowrap;
        }

        .nav-item {
            padding: 12px 16px;
            margin-bottom: 8px;
            border-radius: 14px;
            cursor: pointer;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 12px;
            transition: 0.2s;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .nav-item:hover {
            background: rgba(255, 255, 255, 0.08);
            color: white;
        }

        .nav-item.active {
            background: linear-gradient(135deg, rgba(129, 140, 248, 0.25), rgba(251, 113, 133, 0.25));
            color: #fff;
            border: 1px solid rgba(251, 113, 133, 0.3);
        }

        /* Content Area */
        .content {
            flex: 1;
            padding: 24px;
            max-width: 100%;
            overflow-x: hidden;
            padding-bottom: 40px;
        }

        h2 {
            font-size: 1.5rem;
            margin-bottom: 16px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.82rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        input {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--glass-border);
            color: white;
            padding: 14px 16px;
            border-radius: 14px;
            font-family: inherit;
            margin-bottom: 16px;
            font-size: 16px; /* Mencegah zoom otomatis di iOS */
            transition: 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--accent-gemini);
            background: rgba(0, 0, 0, 0.45);
            box-shadow: 0 0 10px rgba(129, 140, 248, 0.3);
        }

        button {
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            border: none;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            font-size: 1rem;
            transition: transform 0.1s, opacity 0.2s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #6366f1, #f43f5e);
            color: white;
            box-shadow: 0 4px 20px rgba(244, 63, 94, 0.35);
        }

        .btn-primary:active {
            transform: scale(0.97);
        }

        .btn-icon {
            width: 36px;
            height: 36px;
            min-width: 36px;
            padding: 0;
            border-radius: 10px;
            font-size: 1.1rem;
        }

        .btn-del {
            background: rgba(248, 113, 113, 0.15);
            color: #f87171;
            border: 1px solid rgba(248, 113, 113, 0.3);
        }

        /* Layout Grid */
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            align-items: start;
        }

        @media (max-width: 1024px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }

        /* Table Styling */
        .table-responsive {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 280px;
            font-size: 0.9rem;
        }

        th {
            text-align: left;
            padding: 10px 8px;
            color: var(--text-muted);
            border-bottom: 1px solid var(--glass-border);
            font-weight: 600;
            white-space: nowrap;
        }

        td {
            padding: 12px 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            word-break: break-word;
        }

        /* Mobile Glass Navbar Atas (Dioptimalkan untuk iPhone 15 & layar HP modern) */
        .mobile-header {
            display: none;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            position: sticky;
            top: 0;
            z-index: 90;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-bottom: 1px solid var(--glass-border);
            margin: -20px -20px 20px -20px;
            padding-top: max(16px, env(safe-area-inset-top));
        }

        .mobile-logo {
            font-size: 1.25rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(to right, #818cf8, #fb7185);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .avatar-badge {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6366f1, #f43f5e);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1rem;
            box-shadow: 0 2px 10px rgba(99, 102, 241, 0.4);
            cursor: pointer;
        }

        /* Slide-out Menu Drawer untuk Mobile */
        .mobile-drawer {
            position: fixed;
            top: 0;
            right: -100%;
            width: 75%;
            max-width: 280px;
            height: 100vh;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-left: 1px solid var(--glass-border);
            z-index: 110;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            transition: right 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .mobile-drawer.open {
            right: 0;
            box-shadow: -20px 0 50px rgba(0, 0, 0, 0.7);
        }

        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 105;
            opacity: 0;
            pointer-events: none;
            transition: 0.3s;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
        }

        #overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        #install-prompt {
            position: fixed;
            bottom: max(20px, env(safe-area-inset-bottom));
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #6366f1, #f43f5e);
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            display: none;
            z-index: 3000;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            white-space: nowrap;
        }

        /* Penyesuaian khusus layar HP / iPhone 15 */
        @media (max-width: 768px) {
            .sidebar {
                display: none; /* Sembunyikan sidebar desktop di HP */
            }

            .mobile-header {
                display: flex;
            }

            .content {
                padding: 20px;
                padding-bottom: calc(40px + env(safe-area-inset-bottom));
            }

            h2 {
                font-size: 1.35rem;
                margin-bottom: 14px;
            }

            .glass-card {
                padding: 18px;
                border-radius: 20px;
                margin-bottom: 14px;
            }

            .responsive-mt{
                margin-top: 40px;
            }
        }

        /* Login Screen */
        #login-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0f172a;
            z-index: 2000;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 380px;
            padding: 32px 24px;
            text-align: center;
            border-radius: 24px;
        }

        .summary-card {
            background: linear-gradient(135deg, rgba(129, 140, 248, 0.15), rgba(244, 63, 94, 0.15));
            border: 1px solid rgba(251, 113, 133, 0.3);
            border-radius: 20px;
            padding: 18px 20px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>

<body>
    <div class="blobs">
        <div class="blob b1"></div>
        <div class="blob b2"></div>
    </div>

    <div id="overlay" onclick="toggleDrawer()"></div>
    <div id="install-prompt" onclick="installPWA()">📲 Install HeyCase</div>

    <div class="mobile-drawer glass" id="mobileDrawer">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
            <div class="logo" style="margin: 0;"><i class="ri-store-2-line"></i> HeyCase</div>
            <i class="ri-close-line" style="font-size: 1.5rem; cursor: pointer; color: var(--text-muted);" onclick="toggleDrawer()"></i>
        </div>
        <div class="nav-item active"><i class="ri-money-dollar-circle-line"></i> Catat Modal Awal</div>
        <div style="flex: 1;"></div>
        <div class="nav-item" onclick="handleLogout()" style="color: var(--danger); border: 1px solid rgba(248,113,113,0.2);">
            <i class="ri-logout-box-line"></i> Logout
        </div>
    </div>

    <div id="login-screen" class="glass">
        <div class="login-box glass-card">
            <div class="logo" style="justify-content: center; margin-bottom: 10px;"><i class="ri-shield-key-line"></i> HeyCase</div>
            <p style="color: var(--text-muted); margin-bottom: 24px; font-size: 0.9rem;">Login Administrator</p>
            <input type="email" id="email" placeholder="Email">
            <input type="password" id="password" placeholder="Password">
            <button class="btn-primary" onclick="handleLogin()">LOGIN</button>
            <p id="login-error" style="color: var(--danger); margin-top: 14px; font-size: 0.85rem;"></p>
        </div>
    </div>

    <div id="app" style="display: none;">
        <div class="sidebar glass" id="sidebar">
            <div class="logo">
                <i class="ri-store-2-line"></i> HeyCase
            </div>
            <div class="nav-item active"><i class="ri-money-dollar-circle-line"></i> Catat Modal Awal</div>
            <div style="flex: 1;"></div>
            <div class="nav-item" onclick="handleLogout()"
                style="color: var(--danger); border: 1px solid rgba(248,113,113,0.2);">
                <i class="ri-logout-box-line"></i> Logout
            </div>
        </div>

        <div class="content">
            <div class="mobile-header">
                <div class="mobile-logo">
                    <i class="ri-store-2-line"></i> HeyCase
                </div>
                <div class="avatar-badge" onclick="toggleDrawer()">
                    <i class="ri-user-3-line"></i>
                </div>
            </div>

            <h2 class="responsive-mt">Pengeluaran & Modal Awal</h2>

            <div class="summary-card glass">
                <div>
                    <span style="font-size: 0.8rem; color: var(--text-muted);">Total Modal Dikeluarkan</span>
                    <div id="total_modal" style="font-size: 1.5rem; font-weight: 800; color: #fff; margin-top: 2px;">Rp 0</div>
                </div>
                <div style="font-size: 2.2rem; color: var(--accent-cancer);">
                    <i class="ri-safe-2-line"></i>
                </div>
            </div>

            <div class="grid">
                <div class="glass-card">
                    <h3><i class="ri-add-circle-line"></i> Tambah Pengeluaran</h3>
                    <label>Untuk (Keperluan / Keterangan)</label>
                    <input type="text" id="m_untuk" placeholder="Contoh: Beli Bahan Baku / Sewa Tempat">
                    
                    <label>Jumlah Uang (Rp)</label>
                    <input type="number" id="m_uang" placeholder="Contoh: 1500000">
                    
                    <label>Tanggal</label>
                    <input type="date" id="m_tanggal">

                    <button class="btn-primary" onclick="saveModal()">Simpan Pengeluaran</button>
                </div>

                <div class="glass-card">
                    <h3>Riwayat Pengeluaran Modal</h3>
                    <div class="table-responsive" style="max-height: 380px;">
                        <table>
                            <thead>
                                <tr>
                                    <th>Tanggal & Keperluan</th>
                                    <th style="text-align:right">Jumlah (Rp)</th>
                                    <th style="text-align:center">Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="tbl_modal">
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, deleteDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCTkd4lYReewE14fragf_w-CtMoSF9eaAs",
            authDomain: "import-40e84.firebaseapp.com",
            projectId: "import-40e84",
            storageBucket: "import-40e84.firebasestorage.app",
            messagingSenderId: "370082950133",
            appId: "1:370082950133:web:762215012a4ee395414ebc"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Registrasi Service Worker untuk PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(() => console.log("Service Worker Terdaftar!"))
                    .catch((err) => console.log("Gagal daftar SW:", err));
            });
        }

        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('install-prompt').style.display = 'block';
        });

        window.installPWA = async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    document.getElementById('install-prompt').style.display = 'none';
                }
                deferredPrompt = null;
            }
        };

        // Set default tanggal hari ini pada form
        document.getElementById('m_tanggal').valueAsDate = new Date();

        window.toggleDrawer = () => {
            const drawer = document.getElementById('mobileDrawer');
            const overlay = document.getElementById('overlay');
            drawer.classList.toggle('open');
            overlay.classList.toggle('active');
        };

        window.handleLogin = () => {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            if (email !== "craidk@gmail.com") {
                document.getElementById('login-error').innerText = "Akses Ditolak: Email tidak terdaftar.";
                return;
            }
            signInWithEmailAndPassword(auth, email, pass).catch((error) => {
                document.getElementById('login-error').innerText = "Gagal: " + error.message;
            });
        };

        window.handleLogout = () => signOut(auth);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('app').style.display = 'flex';
                initApp();
            } else {
                document.getElementById('login-screen').style.display = 'flex';
                document.getElementById('app').style.display = 'none';
            }
        });

        const formatIDR = (num) => "Rp " + Math.round(num).toLocaleString('id-ID');

        function initApp() {
            const q = query(collection(db, "modal_awal"), orderBy("tanggal", "desc"));
            onSnapshot(q, (snap) => {
                const tbl = document.getElementById('tbl_modal');
                tbl.innerHTML = "";
                let grandTotal = 0;

                if (snap.empty) {
                    tbl.innerHTML = `<tr><td colspan="3" style="text-align:center; color:var(--text-muted); padding:20px;">Belum ada data pengeluaran modal.</td></tr>`;
                    document.getElementById('total_modal').innerText = formatIDR(0);
                    return;
                }

                snap.forEach(d => {
                    const data = d.data();
                    const nominal = parseFloat(data.uang) || 0;
                    grandTotal += nominal;

                    tbl.innerHTML += `
                        <tr>
                            <td>
                                <strong style="font-size: 0.95rem;">${data.untuk}</strong>
                                <br><small style="color:var(--text-muted);">${data.tanggal}</small>
                            </td>
                            <td style="text-align:right; font-weight:600; color:#34d399; white-space:nowrap;">${formatIDR(nominal)}</td>
                            <td style="text-align:center;">
                                <button class="btn-icon btn-del" onclick="deleteModal('${d.id}')">
                                    <i class="ri-delete-bin-line"></i>
                                </button>
                            </td>
                        </tr>
                    `;
                });

                document.getElementById('total_modal').innerText = formatIDR(grandTotal);
            });
        }

        window.saveModal = async () => {
            const untuk = document.getElementById('m_untuk').value.trim();
            const uang = parseFloat(document.getElementById('m_uang').value);
            const tanggal = document.getElementById('m_tanggal').value;

            if (!untuk) return alert("Kolom 'Untuk' wajib diisi!");
            if (isNaN(uang) || uang <= 0) return alert("Masukkan jumlah uang yang valid!");
            if (!tanggal) return alert("Tanggal wajib diisi!");

            try {
                await addDoc(collection(db, "modal_awal"), {
                    untuk: untuk,
                    uang: uang,
                    tanggal: tanggal
                });

                document.getElementById('m_untuk').value = "";
                document.getElementById('m_uang').value = "";
                document.getElementById('m_tanggal').valueAsDate = new Date();
                
                alert("Pengeluaran modal berhasil disimpan!");
            } catch (error) {
                alert("Gagal menyimpan: " + error.message);
            }
        };

        window.deleteModal = async () => {
            // function stub preserved
        };

        window.deleteModal = async (id) => {
            if (confirm("Hapus catatan pengeluaran ini?")) {
                try {
                    await deleteDoc(doc(db, "modal_awal", id));
                } catch (error) {
                    alert("Gagal menghapus: " + error.message);
                }
            }
        };
    </script>
</body>

</html>
